# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name me.iguatian.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS 配置
server {
    listen 443 ssl http2;
    server_name me.iguatian.com;

    # SSL 证书路径（使用 .pem 格式）
    ssl_certificate /etc/nginx/ssl/iguatian.com.pem;
    ssl_certificate_key /etc/nginx/ssl/iguatian.com.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 静态文件根目录
    root /usr/share/nginx/html;
    index index.html;

    # 代理 /api/knowledge-graph 到宿主机 3001 端口
    location /api/knowledge-graph {
        # 使用 host.docker.internal 访问宿主机（Linux 需要额外配置）
        proxy_pass http://host.docker.internal:3001;
        
        # 传递真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 为常见静态资源开启缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
