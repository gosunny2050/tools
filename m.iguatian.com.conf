# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name m.iguatian.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS 配置
server {
    listen 443 ssl http2;
    server_name m.iguatian.com;

    # SSL 证书路径（使用 .pem 格式）
    ssl_certificate /etc/nginx/ssl/iguatian.com.pem;
    ssl_certificate_key /etc/nginx/ssl/iguatian.com.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ===== 静态资源优化：nginx 直接服务 .next/static =====
    # 前提：宿主机 .next/static 已拷贝到挂载目录（见下方说明）
    location /_next/static/ {
        alias /usr/share/nginx/html/_next/static/;   # 容器内挂载路径
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # 图片资源
    location /images/ {
        alias /usr/share/nginx/html/images/;
        expires 30d;
    }

    # ===== 核心：所有页面请求代理到 Next.js Node 服务 =====
    # Next.js 是 SSR 应用，必须代理，不能用 try_files 指向 index.html
    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

